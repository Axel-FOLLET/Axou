<!doctype html>
<html lang="fr" class="snake-page">
<head>
    <!-- Page loaded in the iframe of a card on the portfolio page: the module creates the canvas in the game container. The ?lang=en parameter selects the English texts. -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Browser bar colour on mobile: the page background (--ink in css/base/tokens.css) -->
    <meta name="theme-color" content="#0B0B0F">
    <!-- Page shown inside a portfolio card: it must not appear alone in search engines -->
    <meta name="robots" content="noindex">
    <title>Snake</title>
    <!-- Opened alone, the page would otherwise request /favicon.ico, which the site does not have -->
    <link rel="icon" href="../../assets/images/favicon.svg" type="image/svg+xml">
    <!-- Site font, preloaded: the game waits for it (document.fonts) before drawing -->
    <link rel="preload" href="../../assets/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
    <!-- Site colours (the only file that holds them), then the game layout that uses them -->
    <link rel="stylesheet" href="../../css/base/tokens.css">
    <link rel="stylesheet" href="../../css/components/game-player.css">
</head>
<body class="game-player game-player--snake">
    <!-- Link to jump straight to the content (keyboard); translations.js translates it with ?lang=en -->
    <a class="skip-link" href="#main">Aller au contenu</a>
    <main id="main">
        <h1 class="visually-hidden">Jeu du Snake</h1>
        <div id="snake-game" class="game-player__root"></div>
    </main>
    <script type="module" src="../../js/games/snake/main.js"></script>
</body>
</html>
