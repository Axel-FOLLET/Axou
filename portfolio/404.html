<!doctype html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Page introuvable | Axel FOLLET — Portfolio</title>
    <meta name="author" content="Axel FOLLET">
    <!-- Page d'erreur : elle ne doit pas apparaître dans les moteurs de recherche -->
    <meta name="robots" content="noindex">
    <link rel="icon" href="/portfolio/assets/images/favicon.svg?v=dc02d7f3fc6c" type="image/svg+xml">

    <!--
        Anciennes pages (pages/projects.html, pages/skills-en.html…) : le site tient sur une page par langue.
        Le lien est renvoyé vers la section correspondante. Les anciennes ancres de thème (#theme-algorithms…)
        n'existent plus : elles mènent à la section Projets ; les compétences sont devenues la section Progression.
    -->
    <script>
        {
            const oldPage = location.pathname.match(/\/pages\/(projects|skills|contact)(-en)?\.html$/);
            if (oldPage) {
                const hash = location.hash.startsWith("#theme-") ? "#projects" : location.hash;
                const section = oldPage[1] === "skills" ? "progression" : oldPage[1];
                location.replace("/portfolio/index" + (oldPage[2] || "") + ".html" + (hash || "#" + section));
            }
        }
    </script>

    <!--
        GitHub Pages affiche ce fichier pour toute adresse inexistante du site, quel que soit le dossier :
        les chemins sont donc absolus (/portfolio/...) au lieu d'être relatifs.
        Versions CSS : recharge les styles modifies apres publication.
    -->
    <!-- Serif des grands chiffres, chargé dès le début : « 404 » s'affiche sans passer par Georgia -->
    <link rel="preload" href="/portfolio/assets/fonts/instrument-serif-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/portfolio/css/base.css?v=d1f69494ddc3">
    <link rel="stylesheet" href="/portfolio/css/sections.css?v=2d1322511799">
    <link rel="stylesheet" href="/portfolio/css/buttons.css?v=2108940d7dfb">
    <link rel="stylesheet" href="/portfolio/css/not-found.css?v=fb3425db5fb9">
    <link rel="stylesheet" href="/portfolio/css/motion.css?v=497b42af2aa8">
</head>

<body class="page">

    <main class="not-found">

        <p class="section__eyebrow">ERREUR 404</p>

        <h1 class="not-found__code">404</h1>

        <p class="not-found__text">
            Cette page n'existe pas ou a été déplacée.
        </p>

        <p class="not-found__text not-found__text--en" lang="en">
            This page does not exist or has been moved.
        </p>

        <div class="not-found__actions">
            <a class="button" href="/portfolio/index.html">Retour à l'accueil</a>
            <a class="button" href="/portfolio/index-en.html" lang="en">Back to home</a>
        </div>

    </main>

</body>

</html>
