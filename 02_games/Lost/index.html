<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <!-- `viewport-fit=cover` draws under phone notches; the safe areas are handled by env(safe-area-inset-*) below.
       No `maximum-scale`: page zoom is blocked by `touch-action: none` (and `gesturestart` in cameraControls.js
       for Safari on iOS), which leaves accessibility zoom available on other pages. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#ffe9cc">
  <title>Lost</title>
  <style>
    /* Soft cartoon interface: variables read by the speech bubbles, bars, mini-map and title and end screens. */
    :root {
      --hud-bg: rgba(255, 248, 236, 0.9);
      --hud-text: #5a4335;
      --hud-border: #f2d6b8;
      --hud-shadow: 0 4px 14px rgba(150, 100, 60, 0.18);
      --btn-bg: #ffc9a8;                     /* light peach, contrast about 6:1 with the brown text */
      --btn-bg-hover: #ffb48c;
      --btn-accent: #ff9f7a;
      --font: ui-rounded, "SF Pro Rounded", "Segoe UI Rounded", "Arial Rounded MT Bold", "Nunito", system-ui, sans-serif;
      --gap: 12px;
      --safe-t: max(var(--gap), env(safe-area-inset-top));
      --safe-r: max(var(--gap), env(safe-area-inset-right));
      --safe-b: max(var(--gap), env(safe-area-inset-bottom));
      --safe-l: max(var(--gap), env(safe-area-inset-left));
    }
    /* No page scrolling, bouncing or zooming: every gesture goes to the game. */
    html, body {
      margin: 0; height: 100%; overflow: hidden; background: #ffe9cc;
      overscroll-behavior: none; touch-action: none;
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
      -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
    }
    #app { position: fixed; inset: 0; }
    #app canvas { display: block; touch-action: none; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
